name: Linux integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bookworm
            base: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
          - name: trixie
            base: golang:1.25-trixie@sha256:2c4c60ef415fbfa5e90300722293bef36c5e63fae17570ce18f580af933dbd73
    steps:
      - uses: actions/checkout@v6
      - name: Build immutable validation environment
        run: docker build -f scripts/validation.Dockerfile --build-arg BASE='${{ matrix.base }}' -t bindwitness-validation .
      - name: Race, fuzz, native, CPython and release checks
        run: docker run --rm -v "$PWD:/work" -w /work bindwitness-validation sh scripts/validate.sh 'build/validation/${{ matrix.name }}'
      - name: Two upstream zlib installations
        if: matrix.name == 'bookworm'
        run: |
          docker run --rm -v "$PWD:/work" -w /work bindwitness-validation sh -c '
            sh scripts/build-zlib-roots.sh /work/build/zlib-roots
            env LD_LIBRARY_PATH=/opt/cpython/lib PYTHONHOME=/opt/cpython /opt/cpython/bin/python3 scripts/zlib-validation.py \
              build/validation/bookworm/installed/bindwitness build/zlib-comparison build/zlib-roots/one build/zlib-roots/two
          '
      - name: Give runner ownership of validation artifacts
        if: always()
        run: |
          if [ -d build ]; then
            sudo chown -R "$(id -u):$(id -g)" build
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ matrix.name }}-arm64
          path: |
            build/validation/${{ matrix.name }}/**/*.json
            build/validation/${{ matrix.name }}/*.txt
            build/validation/${{ matrix.name }}/release/bindwitness
            build/zlib-comparison/*.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Package the validated Linux ARM64 binary
        run: |
          gh run download "$GITHUB_RUN_ID" --name reports-bookworm-arm64 --dir build/release-artifact
          binary=build/release-artifact/validation/bookworm/release/bindwitness
          chmod +x "$binary"
          test "$GITHUB_REF_NAME" = "v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/witness/types.go)"
          test "$("$binary" --version)" = "bindwitness ${GITHUB_REF_NAME#v}"
          sh scripts/package-release.sh "$binary"
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir -p build/release-check
          tar xzf "dist/bindwitness-${GITHUB_REF_NAME#v}-linux-arm64.tar.gz" -C build/release-check
          cmp "$binary" "build/release-check/bindwitness-${GITHUB_REF_NAME#v}-linux-arm64/bindwitness"
      - name: Publish the release with archive and checksum
        run: |
          cat > build/release-notes.md <<'NOTES'
          BindWitness v0.1.0 is the first public release: regression testing for selected ELF symbol bindings in controlled Linux/glibc workloads.

          - Capture real `LD_DEBUG=bindings,files` evidence, check explicit provider contracts, and compare saved observations.
          - Preserve ELF identities, raw traces, coverage findings, and distinct PASS, FAIL, UNRESOLVED and INFRASTRUCTURE_ERROR outcomes.
          - Includes fixes for relative DSO identity, partial provider observations, argv[0], signal cleanup, report schema versions and CI artifact ownership.

          The prebuilt binary is Linux ARM64. Capture is validated on glibc 2.36 and 2.41; other versions return UNRESOLVED. Scope: one trusted process in the base linker namespace with immutable artifacts. This is not a general ABI compatibility check.

          Validation includes race, vet, bounded parser fuzzing, real native ELF fixtures, CPython/zlib round trips, two upstream zlib builds, and installed/release binary checks. Both Linux CI environments must pass before publication.

          Download the archive and SHA256SUMS, then run `sha256sum --check SHA256SUMS` before extracting. The archive includes the binary, Apache-2.0 license, README, icon, documentation and JSON schemas.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "dist/bindwitness-${GITHUB_REF_NAME#v}-linux-arm64.tar.gz" dist/SHA256SUMS \
            --verify-tag --draft --title "BindWitness $GITHUB_REF_NAME" --notes-file build/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
